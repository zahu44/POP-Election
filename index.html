<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POP Voting System 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  overflow:hidden;
  position:relative;
}

body::before{
  content:'';
  position:absolute;
  width:500px;
  height:500px;
  background:#3b82f6;
  border-radius:50%;
  filter:blur(180px);
  top:-150px;
  left:-150px;
  opacity:.4;
}

body::after{
  content:'';
  position:absolute;
  width:450px;
  height:450px;
  background:#9333ea;
  border-radius:50%;
  filter:blur(180px);
  bottom:-180px;
  right:-120px;
  opacity:.4;
}

.container{
  width:420px;
  padding:35px;
  border-radius:28px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  color:white;
  z-index:2;
}

.logo{
  width:85px;
  height:85px;
  margin:auto;
  margin-bottom:20px;
  border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#9333ea);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:700;
}

h1{
  text-align:center;
  margin-bottom:8px;
  font-size:28px;
  font-weight:700;
}

.subtitle{
  text-align:center;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:30px;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  color:#e2e8f0;
}

input,
select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:15px;
  background:rgba(255,255,255,.1);
  color:white;
  border:1px solid rgba(255,255,255,.1);
}

select option{
  color:black;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#3b82f6,#9333ea);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  margin-top:20px;
}

button:hover{
  opacity:.9;
}

.success{
  background:#16a34a !important;
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:#94a3b8;
}

.success-box{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:14px;
  background:#16a34a;
  text-align:center;
  font-weight:600;
  animation:fadeIn .5s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="container">

  <div class="logo">POP</div>

  <h1>পুণ্ডুরিয়া শান্তি সংঘ</h1>

  <p class="subtitle">
    কার্যনির্বাহী কমিটি নির্বাচন (২০২৬–২০২৭)
  </p>

  <!-- LOGIN -->
  <div id="loginBox">

    <div class="input-group">
      <label>এখানে আপনার পাসওয়ার্ড দিন</label>

      <input
        type="password"
        id="code"
        placeholder="পাসওয়ার্ড">
    </div>

    <button onclick="login()">
      ভোট দিতে চাপুন
    </button>

  </div>

  <!-- VOTING SECTION -->
  <div id="voteSection" style="display:none;">

    <h2 style="text-align:center;margin-bottom:25px;">
      আপনার ভোট দিন
    </h2>

    <!-- PRESIDENT -->
    <div class="input-group">

      <label>
        এই কমিটিতে শফিকুল ইসলাম জরু কে সভাপতি হিসেবে চান?
      </label>

      <select id="president">
        <option value="">-- ভোট দিন --</option>
        <option>হ্যাঁ</option>
        <option>না</option>
      </select>

    </div>

    <!-- SECRETARY -->
    <div class="input-group">

      <label>
        সাধারণ সম্পাদক হিসেবে কাকে চান
      </label>

      <select id="secretary">

        <option value="">-- ভোট দিন --</option>

        <option>মনিরুজ্জামান সোহেল</option>

        <option>মিল্টন চৌধুরী</option>

      </select>

    </div>

    <!-- TREASURER -->
    <div class="input-group">

      <label>
        এই কমিটিতে মিলন মোর্শেদ কে কোষাধ্যক্ষ হিসেবে চান?
      </label>

      <select id="treasurer">

        <option value="">-- ভোট দিন --</option>

        <option>হ্যাঁ</option>

        <option>না</option>

      </select>

    </div>

    <button id="submitBtn" onclick="submitVote()">
      Submit Vote
    </button>

  </div>

  <!-- SUCCESS MESSAGE -->
  <div id="successBox" class="success-box">
    ✅ আপনার ভোট সফলভাবে জমা হয়েছে
  </div>

  <div class="footer">
    POP Online Election System © 2026
    <br>
    By Election Commissioner Zahurul Islam Pappi
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain: "pop-election.firebaseapp.com",

  projectId: "pop-election"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const validCodes = [

  "2015","2016","2017","2018","2019",

  "2020","2021","2022","2023","2024",

  "2025","2026","2027","2028","2029",

  "2030","2031","2032","2033","2034",

  "demo","demo1","demo2","demo3"

];

// LOGIN
window.login = async function () {

  let code = document
  .getElementById("code")
  .value
  .trim();

  if (!validCodes.includes(code)) {

    alert("❌ Invalid Code!");

    return;
  }

  const ref = doc(db, "votes", code);

  const snap = await getDoc(ref);

  if (snap.exists()) {

    alert("⚠️ আপনি ইতোমধ্যে ভোট দিয়েছেন");

    return;
  }

  document
  .getElementById("voteSection")
  .style.display = "block";

  document
  .getElementById("loginBox")
  .style.display = "none";
};

// SUBMIT VOTE
window.submitVote = async function () {

  try {

    let code = document
    .getElementById("code")
    .value
    .trim();

    let president = document
    .getElementById("president")
    .value;

    let secretary = document
    .getElementById("secretary")
    .value;

    let treasurer = document
    .getElementById("treasurer")
    .value;

    if (!president || !secretary || !treasurer) {

      alert("সব প্রার্থী নির্বাচন করুন");

      return;
    }

    let vote = {

      president: president,

      secretary: secretary,

      treasurer: treasurer,

      time: new Date().toISOString()

    };

    // SAVE TO FIREBASE
    await setDoc(
      doc(db, "votes", code),
      vote
    );

    // BUTTON CHANGE
    let btn = document
    .getElementById("submitBtn");

    btn.innerHTML = "✔ Vote Submitted";

    btn.classList.add("success");

    btn.disabled = true;

    // HIDE VOTE SECTION
    document
    .getElementById("voteSection")
    .style.display = "none";

    // SHOW SUCCESS MESSAGE
    document
    .getElementById("successBox")
    .style.display = "block";

  }

  catch(error){

    console.error(error);

    alert("❌ Firebase Error");

  }

};

</script>

</body>
</html>
